<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contrasenya | El Meu Projecte</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Reuse generic styles from Login if possible or redefine */
        .split-screen {
            display: grid;
            grid-template-columns: 1fr;
            min-height: 100vh;
        }

        @media (min-width: 1024px) {
            .split-screen {
                grid-template-columns: 1fr 1fr;
            }
        }

        .auth-side {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: var(--spacing-xl);
            background-color: var(--surface-color);
        }

        .auth-content {
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }

        .hero-side {
            background-color: var(--primary-color);
            background: linear-gradient(135deg, var(--secondary-color) 0%, var(--text-main) 100%);
            /* Different gradient for variety */
            display: none;
            align-items: center;
            justify-content: center;
            color: white;
            padding: var(--spacing-xl);
        }

        @media (min-width: 1024px) {
            .hero-side {
                display: flex;
            }
        }
    </style>
</head>

<body>
    <div class="split-screen">
        <!-- Esquerra: Formulari -->
        <div class="auth-side">
            <div class="auth-content">
                <div class="mb-4">
                    <a href="login.html"
                        style="font-size: var(--font-small); display: flex; align-items: center; gap: 0.5rem;">
                        &larr; Tornar al login
                    </a>
                </div>

                <div class="auth-header" style="margin-bottom: var(--spacing-xl);">
                    <h1>Recuperar Accés</h1>
                    <p style="color: var(--text-muted);">Introdueix el teu correu institucional per restablir la
                        contrasenya.</p>
                </div>

                <form action="login.html"> <!-- Mock action returning to login for demo -->
                    <div class="form-group">
                        <label class="form-label" for="email">Correu Institucional</label>
                        <input type="email" id="email" class="form-input" placeholder="alumne@biblioteca.edu" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block">Enviar Instruccions</button>
                </form>
            </div>
        </div>

        <!-- Dreta: Decoració -->
        <div class="hero-side">
            <div class="text-center">
                <h2 style="font-size: 3rem; margin-bottom: 1rem;">Seguretat</h2>
                <p>Recupera el teu compte en pocs passos.</p>
            </div>
        </div>
    </div>
</body>

</html>
